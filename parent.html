<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학사일정 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --black:#0D0D0E; --dark:#1A1A1C; --dark2:#2A2A2E;
  --bg:#F4F4F6; --surface:#FFFFFF; --surface2:#F0F0F2;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.14);
  --text:#111112; --text2:#5A5A62; --text3:#9898A0;
  --mint:#1BBFB0; --mint-dark:#13A89A; --mint-light:#E5F9F7;
  --red:#D63B3B; --red-bg:#FDF0F0;
  --r:10px; --rs:6px;
}
body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* ── HEADER ── */
.header { background:var(--black); }
.hi { max-width:1080px; margin:0 auto; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; }
.hl { display:flex; align-items:center; gap:12px; }
.hlogo-img { height:32px; max-width:140px; object-fit:contain; }
.hlogo-icon { width:34px; height:34px; background:var(--mint); border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hlogo-icon svg { fill:white; }
.htitle h1 { font-size:15px; font-weight:700; color:white; letter-spacing:.01em; }
.htitle p { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; letter-spacing:.03em; }
.ybadge { font-size:11px; font-weight:600; padding:4px 12px; background:rgba(27,191,176,0.18); border-radius:99px; color:var(--mint); }

/* ── ADMIN TOOLBAR (admin mode only) ── */
.admin-toolbar { display:none; background:var(--mint); padding:8px 2rem; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.admin-toolbar-in { max-width:1080px; width:100%; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.admin-tag { font-size:11px; font-weight:700; color:white; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:6px; }
.admin-tag::before { content:''; width:7px; height:7px; border-radius:50%; background:white; }
.admin-tools { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.admin-btn { font-size:12px; color:white; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); border-radius:var(--rs); cursor:pointer; padding:5px 10px; font-family:inherit; display:flex; align-items:center; gap:4px; font-weight:500; }
.admin-btn:hover { background:rgba(255,255,255,0.25); }
.admin-btn.danger { background:rgba(255,255,255,0.05); }
.admin-year-sel { font-size:12px; padding:5px 8px; border-radius:var(--rs); background:white; border:1px solid rgba(0,0,0,0.1); color:var(--text); font-family:inherit; cursor:pointer; }
.past-year-banner { background:#FFF4CC; color:#7A5500; padding:9px 2rem; font-size:12px; font-weight:600; text-align:center; border-bottom:1px solid #F0D96A; display:none; }
.past-year-banner.show { display:block; }

/* ── TABS ── */
.tabs-wrap { background:var(--dark); border-bottom:1px solid rgba(255,255,255,0.07); }
.tabs { max-width:1080px; margin:0 auto; padding:0 2rem; display:grid; grid-template-columns:repeat(12,1fr); }
.tab { padding:12px 6px; font-size:13px; font-weight:500; color:rgba(255,255,255,0.4); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:5px; }
.tab:hover { color:rgba(255,255,255,0.7); }
.tab.active { color:var(--mint); border-bottom-color:var(--mint); font-weight:600; }
.tab .cnt { background:var(--mint); color:white; font-size:10px; font-weight:700; padding:1px 5px; border-radius:99px; }
.tab .cnt.empty { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.3); }

/* ── MAIN ── */
.main { max-width:1080px; margin:0 auto; padding:1.75rem 2rem; display:grid; grid-template-columns:1fr 320px; gap:1.75rem; }
.cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-label { font-size:15px; font-weight:700; letter-spacing:-.01em; }
.add-evt-btn { display:none; padding:7px 14px; background:var(--black); color:white; border:none; border-radius:var(--rs); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; align-items:center; gap:5px; }
.add-evt-btn:hover { background:var(--dark2); }
body.admin-mode .add-evt-btn { display:inline-flex; }

.cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:1rem; }
.dh { background:var(--surface2); padding:9px 4px; text-align:center; font-size:11px; font-weight:600; color:var(--text2); letter-spacing:.03em; }
.dh.s { color:#D63B3B; } .dh.sa { color:#2A70D4; }
.dc { background:var(--surface); min-height:90px; padding:6px; cursor:pointer; transition:background .1s; }
.dc.other { background:#F8F8FA; }
.dc:hover { background:var(--mint-light); }
.dc.today { background:var(--mint-light); }
.dn { width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; }
.dn.s { color:#D63B3B; } .dn.sa { color:#2A70D4; }
.dc.other .dn { color:var(--text3); }
.dc.today .dn { background:var(--black); color:white !important; border-radius:50%; }
.ces { margin-top:2px; display:flex; flex-direction:column; gap:2px; }
.chip { font-size:10px; padding:2px 5px; border-radius:3px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.chip:hover { opacity:.78; }
.chip-rs { border-radius:3px 0 0 3px; margin-right:-6px; }
.chip-rm { border-radius:0; margin:0 -6px; }
.chip-re { border-radius:0 3px 3px 0; margin-left:-6px; }
.more { font-size:10px; color:var(--text3); padding:1px 4px; cursor:pointer; }
.legend { display:flex; flex-wrap:wrap; gap:10px; }
.leg { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text2); }
.leg-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ── NOTICE ── */
.notice-wrap { margin-top:20px; border-radius:var(--r); overflow:hidden; border:1px solid var(--border); }
.notice-head { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--black); }
.notice-head-left { display:flex; align-items:center; gap:8px; }
.notice-dot { width:6px; height:6px; border-radius:50%; background:var(--mint); flex-shrink:0; }
.notice-head-lbl { font-size:13px; font-weight:600; color:white; }
.notice-body { padding:16px; font-size:14px; line-height:1.85; color:var(--text); white-space:pre-wrap; word-break:break-word; background:var(--surface); }
.notice-empty { padding:14px 16px; font-size:13px; color:var(--text3); background:var(--surface); }
.notice-edit-btn { display:none; font-size:12px; padding:4px 10px; background:none; border:1px solid rgba(255,255,255,0.25); border-radius:var(--rs); cursor:pointer; color:rgba(255,255,255,0.7); font-family:inherit; }
.notice-edit-btn:hover { background:rgba(255,255,255,0.1); color:white; }
body.admin-mode .notice-edit-btn { display:inline-block; }
.notice-editor { padding:14px 16px; background:var(--surface); display:flex; flex-direction:column; gap:10px; }
.notice-editor textarea { width:100%; padding:10px 12px; border:1px solid var(--border2); border-radius:var(--rs); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); resize:vertical; min-height:100px; line-height:1.75; }
.notice-editor textarea:focus { outline:none; border-color:var(--mint); }
.notice-editor-btns { display:flex; gap:8px; justify-content:flex-end; }

/* ── SIDE LIST ── */
.side-label { font-size:12px; font-weight:700; margin-bottom:12px; color:var(--text2); text-transform:uppercase; letter-spacing:.05em; }
.ecards { display:flex; flex-direction:column; gap:8px; }
.ecard { background:var(--surface); border:1px solid var(--border); border-radius:var(--rs); padding:13px 14px; cursor:pointer; transition:border-color .12s,box-shadow .12s; }
.ecard:hover { border-color:var(--mint); box-shadow:0 2px 12px rgba(27,191,176,0.12); }
.ec-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
.badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:3px; }
.ec-date { font-size:11px; color:var(--text3); }
.ec-title { font-size:13px; font-weight:600; }
.ec-meta { font-size:12px; color:var(--text2); margin-top:3px; }
.ec-range { font-size:11px; color:var(--mint-dark); font-weight:600; margin-top:2px; }
.no-evts { text-align:center; padding:2rem 1rem; color:var(--text3); font-size:13px; }

/* ── MODAL ── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:20px 12px 40px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:16px; width:100%; max-width:460px; box-shadow:0 16px 50px rgba(0,0,0,0.25); margin:auto; }
.modal.wide { max-width:520px; }
.mh { padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; }
.mh h2 { font-size:17px; font-weight:700; line-height:1.4; padding-right:8px; letter-spacing:-.01em; }
.cx { background:none; border:none; font-size:22px; cursor:pointer; color:var(--text3); line-height:1; flex-shrink:0; }
.cx:hover { color:var(--text); }
.mb { padding:1.25rem 1.5rem; }
.mf { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.btn-close { width:100%; padding:11px 24px; background:var(--black); color:white; border:none; border-radius:var(--rs); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; letter-spacing:.02em; }
.btn-close:hover { background:var(--dark2); }
.drow { display:flex; gap:14px; margin-bottom:14px; align-items:flex-start; }
.dlbl { font-size:10px; color:var(--text3); min-width:44px; padding-top:2px; flex-shrink:0; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.dval { font-size:14px; flex:1; line-height:1.7; word-break:break-word; }
.note-pre { white-space:pre-wrap; word-break:break-word; line-height:1.85; font-size:14px; color:var(--text); background:var(--bg); border-radius:var(--rs); padding:14px 16px; }
.link-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#2A70D4; cursor:pointer; padding:9px 14px; border:1px solid #C0D7F5; border-radius:var(--rs); background:#EEF5FD; width:100%; font-family:inherit; text-decoration:none; }
.link-btn:hover { background:#DDEAFB; }
.link-btn-text { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── FORMS (admin) ── */
.fg { margin-bottom:14px; }
.fl { display:block; font-size:11px; color:var(--text2); font-weight:600; margin-bottom:5px; letter-spacing:.03em; text-transform:uppercase; }
.fi { width:100%; padding:9px 11px; border:1px solid var(--border2); border-radius:var(--rs); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); }
.fi:focus { outline:none; border-color:var(--mint); }
.frow2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.fta { width:100%; padding:9px 11px; border:1px solid var(--border2); border-radius:var(--rs); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); resize:vertical; min-height:80px; line-height:1.6; }
.fta:focus { outline:none; border-color:var(--mint); }
.fse { width:100%; padding:9px 11px; border:1px solid var(--border2); border-radius:var(--rs); font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); }
.fse:focus { outline:none; border-color:var(--mint); }
.btn-g { padding:8px 16px; background:none; border:1px solid var(--border2); border-radius:var(--rs); font-size:13px; font-weight:500; cursor:pointer; color:var(--text); font-family:inherit; }
.btn-g:hover { background:var(--surface2); }
.btn-p { padding:8px 18px; background:var(--black); color:white; border:none; border-radius:var(--rs); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn-p:hover { background:var(--dark2); }
.btn-d { padding:8px 14px; background:none; border:1px solid var(--red); border-radius:var(--rs); font-size:13px; font-weight:500; cursor:pointer; color:var(--red); font-family:inherit; }
.btn-d:hover { background:var(--red-bg); }
.date-toggle { display:flex; border:1px solid var(--border2); border-radius:var(--rs); overflow:hidden; margin-bottom:12px; }
.dt-btn { flex:1; padding:7px; font-size:12px; font-weight:600; background:none; border:none; cursor:pointer; font-family:inherit; color:var(--text2); }
.dt-btn.active { background:var(--black); color:white; }
.dt-btn:not(.active):hover { background:var(--surface2); }
.date-range-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* CAT MANAGER */
.cat-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
.cat-row:last-child { border-bottom:none; }
.cat-row-badge { font-size:12px; font-weight:700; padding:4px 12px; border-radius:3px; }
.cat-row-acts { display:flex; gap:6px; margin-left:auto; }
.icon-btn { background:none; border:1px solid var(--border2); border-radius:var(--rs); padding:4px 10px; cursor:pointer; font-size:12px; color:var(--text2); font-family:inherit; }
.icon-btn:hover { background:var(--surface2); }
.icon-btn.del { border-color:#F0A0A0; color:var(--red); }
.icon-btn.del:hover { background:var(--red-bg); }
.color-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:6px; }
.col-opt { height:38px; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; border:2px solid transparent; }
.col-opt.sel { border-color:var(--black); }
.col-opt:hover { opacity:.82; }
.add-cat { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
.add-cat-title { font-size:12px; font-weight:700; color:var(--text2); margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em; }

/* SETTINGS LOGO */
.settings-logo-preview { width:80px; height:80px; border:1px solid var(--border2); border-radius:var(--rs); display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--bg); margin-bottom:8px; }
.settings-logo-preview img { max-width:100%; max-height:100%; object-fit:contain; }
.settings-logo-preview .placeholder { font-size:11px; color:var(--text3); text-align:center; padding:8px; }
.file-upload-label { display:inline-block; padding:7px 14px; background:none; border:1px solid var(--border2); border-radius:var(--rs); font-size:12px; color:var(--text2); cursor:pointer; font-family:inherit; }
.file-upload-label:hover { background:var(--surface2); }

/* DAY LIST */
.erow { border:1px solid var(--border); border-radius:var(--rs); padding:10px 13px; display:flex; align-items:center; gap:10px; cursor:pointer; margin-bottom:8px; }
.erow:hover { border-color:var(--black); }
.erow-title { font-size:14px; font-weight:600; }
.erow-meta { font-size:12px; color:var(--text2); margin-top:2px; }

/* ── ADMIN FAB (login trigger) ── */
.admin-fab { position:fixed; bottom:16px; right:16px; width:40px; height:40px; border-radius:50%; background:rgba(0,0,0,0.15); color:white; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:18px; z-index:50; opacity:0.5; transition:opacity .2s,background .2s; }
.admin-fab:hover { opacity:1; background:rgba(0,0,0,0.6); }
body.admin-mode .admin-fab { display:none; }

/* ── TOAST ── */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--black); color:white; padding:10px 20px; border-radius:99px; font-size:13px; font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; z-index:200; display:inline-flex; align-items:center; gap:14px; max-width:92vw; }
.toast.show { opacity:1; pointer-events:auto; }
.toast-btn { background:transparent; border:none; color:var(--mint); font-weight:700; cursor:pointer; font-family:inherit; font-size:13px; padding:0; letter-spacing:.02em; }
.toast-btn:hover { color:#4DD9CB; }

.loading { text-align:center; padding:5rem 2rem; color:var(--text3); }
.ld { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mint); margin:0 3px; animation:ld 1.2s infinite ease-in-out; }
.ld:nth-child(2){animation-delay:.2s;} .ld:nth-child(3){animation-delay:.4s;}
@keyframes ld{0%,80%,100%{opacity:.25}40%{opacity:1}}

@media (max-width:720px) {
  .main{grid-template-columns:1fr;padding:1rem;}
  .hi{padding:0 1rem;}
  .tabs{padding:0 1rem;grid-template-columns:repeat(6,1fr);}
  .tab{font-size:12px;padding:11px 3px;gap:3px;}
  .tab .cnt{font-size:9px;}
  .modal{border-radius:14px;}
  .admin-toolbar{padding:8px 1rem;}
  .frow2{grid-template-columns:1fr;}
  .date-range-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div class="hi">
    <div class="hl">
      <div id="headerLogo"></div>
      <div class="htitle">
        <h1 id="headerTitle">학사일정 안내</h1>
        <p>SCHEDULE GUIDE</p>
      </div>
    </div>
    <div class="ybadge" id="yearBadge"></div>
  </div>
</div>

<!-- Admin toolbar (shown only in admin mode) -->
<div class="admin-toolbar" id="adminToolbar">
  <div class="admin-toolbar-in">
    <div class="admin-tag">관리자 모드</div>
    <div class="admin-tools">
      <select class="admin-year-sel" id="yearSel" onchange="switchYear(this.value)"></select>
      <button class="admin-btn" onclick="openSettings()">⚙️ 설정</button>
      <button class="admin-btn" onclick="openCatManager()">🏷️ 분류</button>
      <button class="admin-btn" onclick="openDefaultMonthSetting()">📅 첫화면</button>
      <button class="admin-btn" onclick="openCopyFromYear()">📥 전년 복사</button>
      <button class="admin-btn danger" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
</div>

<!-- Past year warning banner (admin only, when viewing non-default year) -->
<div class="past-year-banner" id="pastYearBanner"></div>

<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>

<div class="main">
  <div>
    <div class="loading" id="loadingArea"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
    <div id="calArea" style="display:none">
      <div class="cal-head">
        <div class="cal-label" id="calLabel"></div>
        <button class="add-evt-btn" onclick="openForm(null,null)">+ 일정 추가</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend" id="legend"></div>
      <div id="noticeArea"></div>
    </div>
  </div>
  <div>
    <div class="side-label" id="sideLabel"></div>
    <div class="ecards" id="ecards"></div>
  </div>
</div>

<!-- Admin login FAB -->
<button class="admin-fab" id="adminFab" onclick="openLoginModal()" title="관리자">⚙</button>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>

  projectId: "dscalendar-6e30b",
  storageBucket: "dscalendar-6e30b.firebasestorage.app",
  messagingSenderId: "639581944454",
  appId: "1:639581944454:web:8f21bb993c061a3cb22f07"
};

// ══════════════════════════════════════════
// ADMIN CREDENTIALS
// (Firebase Console에서 Auth → Users → Add user로 이메일/비번 생성 후
//  아래 두 상수에 그 값을 입력하세요)
// ══════════════════════════════════════════
const FIREBASE_ADMIN_EMAIL = 'ENTER_FIREBASE_EMAIL_HERE';
const FIREBASE_ADMIN_PASSWORD = 'ENTER_FIREBASE_PASSWORD_HERE';
const ADMIN_UI_ID = 'admin';
const ADMIN_UI_PW = 'admin6688';

// ══════════════════════════════════════════
// CONSTANTS / STATE
// ══════════════════════════════════════════
const DEFAULT_YEAR = '2027';
const AVAILABLE_YEARS = ['2027','2026'];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const DKO=['일','월','화','수','목','금','토'];
const DEFAULT_CATS=[
  {id:'p',name:'행사/특별활동',color:'pink'},{id:'b',name:'학교행정',color:'blue'},
  {id:'g',name:'교외활동',color:'green'},{id:'a',name:'시험/평가',color:'amber'},
  {id:'t',name:'방학/휴일',color:'teal'},{id:'v',name:'학부모 관련',color:'purple'},
];
const PALETTE=[
  {id:'pink',  bg:'#FBEAF0',text:'#993556',label:'분홍'},
  {id:'blue',  bg:'#E6F1FB',text:'#185FA5',label:'파랑'},
  {id:'green', bg:'#EAF3DE',text:'#3B6D11',label:'초록'},
  {id:'amber', bg:'#FAEEDA',text:'#854F0B',label:'황색'},
  {id:'teal',  bg:'#E1F5EE',text:'#0F6E56',label:'민트'},
  {id:'purple',bg:'#EEEDFE',text:'#3C3489',label:'보라'},
  {id:'coral', bg:'#FAECE7',text:'#993C1D',label:'코랄'},
  {id:'gray',  bg:'#F1EFE8',text:'#5F5E5A',label:'회색'},
];

let YEAR = DEFAULT_YEAR;
let curM = new Date().getMonth();
let isAdmin = false;
let events={}, cats=[], notices={}, siteSettings={title:'',logoData:'',defaultMonth:null};
let eventsRef=null, noticesRef=null;
let editCatId=null, selColor='pink', pendingLogoData='';
let formDateType='single';
let defaultMonthApplied=false;

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function pal(c){return PALETTE.find(p=>p.id===c)||PALETTE[0];}
function catOf(id){return cats.find(c=>c.id===id)||{id:'?',name:'기타',color:'gray'};}
function fmt(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function bs(c){const p=pal(c);return `background:${p.bg};color:${p.text}`;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s).replace(/"/g,'&quot;');}
function autoLink(s){return escHtml(s).replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#1BBFB0;word-break:break-all;">$1</a>');}
function dateInRange(ds,ev){const end=ev.dateEnd||ev.date;return ds>=ev.date&&ds<=end;}
function evtsForDate(ds){return Object.entries(events).filter(([k,e])=>dateInRange(ds,e)).map(([k,e])=>({...e,_key:k})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time||'')>(b.time||'')?1:-1);}
function monthEvts(m){
  const mF=`${YEAR}-${String(m+1).padStart(2,'0')}-01`,mL=fmt(YEAR,m,new Date(parseInt(YEAR),m+1,0).getDate());
  return Object.entries(events).filter(([k,e])=>{const end=e.dateEnd||e.date;return e.date<=mL&&end>=mF;}).map(([k,e])=>({...e,_key:k})).sort((a,b)=>a.date>b.date?1:-1);
}
function formatDateRange(ev){
  if(!ev.dateEnd||ev.dateEnd===ev.date)return ev.date+' ('+DKO[new Date(ev.date).getDay()]+')';
  return `${ev.date} (${DKO[new Date(ev.date).getDay()]}) ~ ${ev.dateEnd} (${DKO[new Date(ev.dateEnd).getDay()]})`;
}
function getE(key){const v=events[key];return v?{...v,_key:key}:null;}
window.getE=getE;

// ══════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// Settings (title, logo, defaultMonth) — always loaded
db.ref('settings').on('value', snap => {
  const v = snap.val() || {};
  siteSettings = {
    title: v.title || '',
    logoData: v.logoData || '',
    defaultMonth: v.defaultMonth || null
  };
  applySiteSettings();
  // Apply defaultMonth once on initial load (viewer mode only)
  if (!isAdmin && !defaultMonthApplied) {
    defaultMonthApplied = true;
    applyDefaultMonth();
  }
});

// Categories (cross-year)
db.ref('cats').on('value', snap => {
  const v = snap.val();
  cats = v ? Object.values(v) : [...DEFAULT_CATS];
  renderLeg(); renderTabs(); renderCal(); renderSide();
});

// Initial year subscription (will be overridden by defaultMonth if applicable)
subscribeYear(YEAR);
// Populate year dropdown for admin
populateYearSelect();

// ══════════════════════════════════════════
// YEAR SUBSCRIPTION
// ══════════════════════════════════════════
function subscribeYear(year) {
  if (eventsRef) eventsRef.off();
  if (noticesRef) noticesRef.off();
  YEAR = year;
  eventsRef = db.ref(`events/${year}`);
  noticesRef = db.ref(`notices/${year}`);
  eventsRef.on('value', snap => {
    events = snap.val() || {};
    renderTabs(); renderCal(); renderSide();
    const loadEl = document.getElementById('loadingArea');
    const calEl = document.getElementById('calArea');
    if (loadEl) loadEl.style.display = 'none';
    if (calEl) calEl.style.display = 'block';
    const yb = document.getElementById('yearBadge');
    if (yb) yb.textContent = year + '년';
  });
  noticesRef.on('value', snap => {
    notices = snap.val() || {};
    renderNotice();
  });
  updatePastYearBanner();
}

function applySiteSettings() {
  const logoEl = document.getElementById('headerLogo');
  const titleEl = document.getElementById('headerTitle');
  const name = siteSettings.title;
  if (logoEl) {
    if (siteSettings.logoData) {
      logoEl.innerHTML = `<img src="${siteSettings.logoData}" class="hlogo-img" alt="logo">`;
    } else {
      logoEl.innerHTML = `<div class="hlogo-icon"><svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></div>`;
    }
  }
  if (titleEl) titleEl.textContent = name ? name + ' 학사일정' : '학사일정 안내';
  document.title = name ? name + ' 학사일정' : '학사일정 안내';
}

function applyDefaultMonth() {
  const dm = siteSettings.defaultMonth;
  if (!dm || !dm.startDate || !dm.endDate || !dm.year || !dm.month) {
    if (YEAR !== DEFAULT_YEAR) subscribeYear(DEFAULT_YEAR);
    curM = new Date().getMonth();
    renderTabs(); renderCal(); renderSide();
    return;
  }
  const t = new Date();
  const today = fmt(t.getFullYear(), t.getMonth(), t.getDate());
  if (today >= dm.startDate && today <= dm.endDate) {
    const targetYear = String(dm.year);
    curM = parseInt(dm.month) - 1;
    if (YEAR !== targetYear) subscribeYear(targetYear);
    else { renderTabs(); renderCal(); renderSide(); }
  } else {
    if (YEAR !== DEFAULT_YEAR) subscribeYear(DEFAULT_YEAR);
    curM = new Date().getMonth();
    renderTabs(); renderCal(); renderSide();
  }
}

function populateYearSelect() {
  const sel = document.getElementById('yearSel');
  if (!sel) return;
  sel.innerHTML = AVAILABLE_YEARS.map(y => `<option value="${y}"${y===YEAR?' selected':''}>${y}년</option>`).join('');
}

function switchYear(y) {
  if (!isAdmin) return;
  curM = (y === String(new Date().getFullYear())) ? new Date().getMonth() : 0;
  subscribeYear(y);
  populateYearSelect();
}
window.switchYear = switchYear;

function updatePastYearBanner() {
  const b = document.getElementById('pastYearBanner');
  if (!b) return;
  if (isAdmin && YEAR !== DEFAULT_YEAR) {
    b.textContent = `📁 과거 연도 열람 중: ${YEAR}년 — 수정/삭제 시 과거 데이터가 변경됩니다`;
    b.classList.add('show');
  } else {
    b.classList.remove('show');
  }
}

// ══════════════════════════════════════════
// RENDERING
// ══════════════════════════════════════════
function renderTabs() {
  const tabs = document.getElementById('tabs');
  if (!tabs) return;
  tabs.innerHTML = '';
  for (let m = 0; m < 12; m++) {
    const cnt = monthEvts(m).length;
    const t = document.createElement('button');
    t.className = 'tab' + (m === curM ? ' active' : '');
    t.innerHTML = `${MONTHS[m]}<span class="cnt${cnt===0?' empty':''}">${cnt}</span>`;
    t.onclick = () => { curM = m; renderTabs(); renderCal(); renderSide(); };
    tabs.appendChild(t);
  }
}

function renderLeg() {
  const leg = document.getElementById('legend');
  if (!leg) return;
  leg.innerHTML = cats.map(c => {
    const p = pal(c.color);
    return `<div class="leg"><div class="leg-dot" style="background:${p.text}"></div>${c.name}</div>`;
  }).join('');
}

function renderCal() {
  const lbl = document.getElementById('calLabel');
  const g = document.getElementById('calGrid');
  if (!g) return;
  if (lbl) lbl.textContent = `${YEAR}년 ${MONTHS[curM]}`;
  g.innerHTML = '';
  DKO.forEach((d, i) => {
    const h = document.createElement('div');
    h.className = 'dh' + (i === 0 ? ' s' : i === 6 ? ' sa' : '');
    h.textContent = d;
    g.appendChild(h);
  });
  const Y = parseInt(YEAR);
  const first = new Date(Y, curM, 1), last = new Date(Y, curM + 1, 0);
  const today = fmt(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
  const start = first.getDay();
  for (let i = 0; i < start; i++) addCell(g, new Date(Y, curM, -(start - i - 1)), true, today);
  for (let d = 1; d <= last.getDate(); d++) addCell(g, new Date(Y, curM, d), false, today);
  const rem = (7 - ((start + last.getDate()) % 7)) % 7;
  for (let i = 1; i <= rem; i++) addCell(g, new Date(Y, curM + 1, i), true, today);
  renderNotice();
}

function addCell(g, dt, other, today) {
  const ds = fmt(dt.getFullYear(), dt.getMonth(), dt.getDate());
  const isT = ds === today, dow = dt.getDay();
  const cell = document.createElement('div');
  cell.className = 'dc' + (other ? ' other' : '') + (isT ? ' today' : '');
  const dn = document.createElement('div');
  dn.className = 'dn' + (dow === 0 ? ' s' : dow === 6 ? ' sa' : '');
  dn.textContent = dt.getDate();
  cell.appendChild(dn);
  const evts = evtsForDate(ds);
  if (evts.length) {
    const ec = document.createElement('div'); ec.className = 'ces';
    evts.slice(0, 2).forEach(ev => {
      const p = pal(catOf(ev.cat).color);
      const isR = ev.dateEnd && ev.dateEnd !== ev.date;
      const c = document.createElement('div');
      if (!isR) { c.className = 'chip'; c.textContent = (ev.time ? ev.time + ' ' : '') + ev.title; }
      else if (ds === ev.date) { c.className = 'chip chip-rs'; c.textContent = ev.title; }
      else if (ds === ev.dateEnd) { c.className = 'chip chip-re'; c.textContent = ev.title; }
      else { c.className = 'chip chip-rm'; c.textContent = ev.title; }
      c.style.cssText = `background:${p.bg};color:${p.text}`;
      c.onclick = e => { e.stopPropagation(); openView(ev); };
      ec.appendChild(c);
    });
    if (evts.length > 2) {
      const m = document.createElement('div'); m.className = 'more'; m.textContent = `+${evts.length-2}`;
      m.onclick = e => { e.stopPropagation(); openDayList(ds, evts); };
      ec.appendChild(m);
    }
    cell.appendChild(ec);
  }
  // Admin: clicking empty cell opens form for that date
  if (isAdmin) {
    cell.onclick = () => openForm(null, ds);
  }
  g.appendChild(cell);
}

function renderSide() {
  const evts = monthEvts(curM);
  const lbl = document.getElementById('sideLabel');
  if (lbl) lbl.textContent = `${MONTHS[curM]} 일정`;
  const cards = document.getElementById('ecards');
  if (!cards) return;
  cards.innerHTML = '';
  if (!evts.length) { cards.innerHTML = '<div class="no-evts">이번 달 등록된 일정이 없습니다.</div>'; return; }
  evts.forEach(ev => {
    const cat = catOf(ev.cat), dt = new Date(ev.date), p = pal(cat.color);
    const isR = ev.dateEnd && ev.dateEnd !== ev.date;
    const c = document.createElement('div'); c.className = 'ecard';
    c.innerHTML = `
      <div class="ec-top"><span class="badge" style="background:${p.bg};color:${p.text}">${cat.name}</span><span class="ec-date">${ev.date} (${DKO[dt.getDay()]})</span></div>
      <div class="ec-title">${escHtml(ev.title)}</div>
      ${isR?`<div class="ec-range">~ ${ev.dateEnd} (${DKO[new Date(ev.dateEnd).getDay()]}) 까지</div>`:''}
      ${(ev.time||ev.place)?`<div class="ec-meta">${ev.time||''}${ev.time&&ev.place?' · ':''}${ev.place||''}</div>`:''}`;
    c.onclick = () => openView(ev);
    cards.appendChild(c);
  });
}

function renderNotice() {
  const area = document.getElementById('noticeArea');
  if (!area) return;
  const key = String(curM + 1).padStart(2, '0'), text = notices[key] || '';
  const adminBtn = isAdmin ? `<button class="notice-edit-btn" onclick="openNoticeEditor()">수정</button>` : '';
  if (!text) {
    if (isAdmin) {
      area.innerHTML = `<div class="notice-wrap"><div class="notice-head"><div class="notice-head-left"><div class="notice-dot"></div><div class="notice-head-lbl">${MONTHS[curM]} 공지 및 안내사항</div></div>${adminBtn}</div><div class="notice-empty">공지사항이 없습니다. 수정 버튼을 눌러 작성하세요.</div></div>`;
    } else {
      area.innerHTML = '';
    }
    return;
  }
  area.innerHTML = `<div class="notice-wrap"><div class="notice-head"><div class="notice-head-left"><div class="notice-dot"></div><div class="notice-head-lbl">${MONTHS[curM]} 공지 및 안내사항</div></div>${adminBtn}</div><div class="notice-body">${autoLink(text)}</div></div>`;
}

// ══════════════════════════════════════════
// VIEW EVENT (common + admin edit/delete)
// ══════════════════════════════════════════
function openView(ev) {
  const cat = catOf(ev.cat), p = pal(cat.color);
  const adminFooter = isAdmin
    ? `<button class="btn-d" onclick="delEvt('${ev._key}')">삭제</button><button class="btn-g" onclick="openForm(getE('${ev._key}'),null)">수정</button><button class="btn-g" onclick="closeModal()">닫기</button>`
    : `<button class="btn-close" onclick="closeModal()">확인</button>`;
  document.getElementById('modal').className = 'modal';
  document.getElementById('modal').innerHTML = `
    <div class="mh"><div style="flex:1"><div style="margin-bottom:8px"><span class="badge" style="background:${p.bg};color:${p.text}">${cat.name}</span></div><h2>${escHtml(ev.title)}</h2></div><button class="cx" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <div class="drow"><div class="dlbl">날짜</div><div class="dval">${formatDateRange(ev)}</div></div>
      ${ev.time?`<div class="drow"><div class="dlbl">시간</div><div class="dval">${escHtml(ev.time)}</div></div>`:''}
      ${ev.place?`<div class="drow"><div class="dlbl">장소</div><div class="dval">${escHtml(ev.place)}</div></div>`:''}
      ${ev.note?`<div class="drow"><div class="dlbl">안내</div><div class="dval"><div class="note-pre">${escHtml(ev.note)}</div></div></div>`:''}
      ${ev.link?`<div class="drow"><div class="dlbl">링크</div><div class="dval"><button class="link-btn" onclick="openAppLink('${ev.link.replace(/'/g,"\\'").replace(/"/g,'&quot;')}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg><span class="link-btn-text">관련 링크 열기</span></button></div></div>`:''}
    </div>
    <div class="mf">${adminFooter}</div>`;
  document.getElementById('overlay').classList.add('open');
}
window.openView = openView;

function openDayList(ds, evts) {
  const dt = new Date(ds);
  const rows = evts.map(ev => {
    const cat = catOf(ev.cat), p = pal(cat.color);
    const isR = ev.dateEnd && ev.dateEnd !== ev.date;
    return `<div class="ecard" onclick="closeModal();setTimeout(()=>openViewByKey('${ev._key}'),60)" style="margin-bottom:8px"><div class="ec-top"><span class="badge" style="background:${p.bg};color:${p.text}">${cat.name}</span></div><div class="ec-title">${escHtml(ev.title)}</div>${isR?`<div class="ec-range">~ ${ev.dateEnd} 까지</div>`:''}</div>`;
  }).join('');
  document.getElementById('modal').className = 'modal';
  document.getElementById('modal').innerHTML = `<div class="mh"><h2>${ds} (${DKO[dt.getDay()]}) 일정 ${evts.length}건</h2><button class="cx" onclick="closeModal()">✕</button></div><div class="mb">${rows}</div>`;
  document.getElementById('overlay').classList.add('open');
}
function openViewByKey(key) { const v = events[key]; if (v) openView({...v, _key: key}); }
window.openViewByKey = openViewByKey;

function openAppLink(url) {
  const isAndroid = /Android/i.test(navigator.userAgent);
  if (isAndroid) {
    try {
      const u = new URL(url);
      const intentUrl = 'intent://' + u.host + u.pathname + u.search
        + '#Intent;scheme=' + u.protocol.replace(':','')
        + ';S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
      window.location.href = intentUrl;
    } catch (e) { window.location.href = url; }
  } else {
    window.location.href = url;
  }
}
window.openAppLink = openAppLink;

// ══════════════════════════════════════════
// EVENT FORM (admin)
// ══════════════════════════════════════════
function openForm(ev, dateDefault) {
  if (!isAdmin) return;
  const isEdit = !!ev;
  formDateType = (ev && ev.dateEnd && ev.dateEnd !== ev.date) ? 'range' : 'single';
  const defaultDate = dateDefault || fmt(parseInt(YEAR), curM, 1);
  const catOpts = cats.map(c => `<option value="${c.id}"${(ev&&ev.cat===c.id)||(!ev&&cats[0]&&c.id===cats[0].id)?' selected':''}>${c.name}</option>`).join('');
  document.getElementById('modal').className = 'modal';
  document.getElementById('modal').innerHTML = `
    <div class="mh"><h2>${isEdit?'일정 수정':'일정 추가'}</h2><button class="cx" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <div class="fg">
        <label class="fl">날짜 유형</label>
        <div class="date-toggle"><button class="dt-btn${formDateType==='single'?' active':''}" id="dtSingle" onclick="switchDateType('single')">하루</button><button class="dt-btn${formDateType==='range'?' active':''}" id="dtRange" onclick="switchDateType('range')">기간</button></div>
        <div id="dateFields">${renderDateFields(ev, defaultDate)}</div>
      </div>
      <div class="fg"><label class="fl">제목 *</label><input class="fi" type="text" id="fTitle" placeholder="예: 입학식, 학부모 상담" value="${ev?escAttr(ev.title):''}"></div>
      <div class="fg"><label class="fl">분류</label><select class="fse" id="fCat">${catOpts}</select></div>
      <div class="frow2"><div class="fg"><label class="fl">시간</label><input class="fi" type="text" id="fTime" placeholder="예: 10:00" value="${ev?escAttr(ev.time||''):''}"></div><div class="fg"><label class="fl">장소</label><input class="fi" type="text" id="fPlace" placeholder="예: 강당" value="${ev?escAttr(ev.place||''):''}"></div></div>
      <div class="fg"><label class="fl">안내 내용</label><textarea class="fta" id="fNote" placeholder="학부모님께 전달할 내용">${ev?escAttr(ev.note||''):''}</textarea></div>
      <div class="fg"><label class="fl">관련 링크</label><input class="fi" type="url" id="fLink" placeholder="https://..." value="${ev?escAttr(ev.link||''):''}"></div>
    </div>
    <div class="mf"><button class="btn-g" onclick="closeModal()">취소</button><button class="btn-p" onclick="saveForm('${isEdit?ev._key:''}',${isEdit})">${isEdit?'수정 완료':'추가'}</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
window.openForm = openForm;

function renderDateFields(ev, defaultDate) {
  if (formDateType === 'single') {
    const v = ev ? ev.date : (defaultDate || '');
    return `<input class="fi" type="date" id="fDate" value="${v}">`;
  }
  const s = ev ? ev.date : (defaultDate || '');
  const e = ev ? (ev.dateEnd || ev.date) : (defaultDate || '');
  return `<div class="date-range-row"><div><label class="fl" style="font-size:10px">시작일</label><input class="fi" type="date" id="fDate" value="${s}"></div><div><label class="fl" style="font-size:10px">종료일</label><input class="fi" type="date" id="fDateEnd" value="${e}"></div></div>`;
}

function switchDateType(type) {
  formDateType = type;
  document.getElementById('dtSingle').className = 'dt-btn' + (type === 'single' ? ' active' : '');
  document.getElementById('dtRange').className = 'dt-btn' + (type === 'range' ? ' active' : '');
  const cur = document.getElementById('fDate'), curVal = cur ? cur.value : '';
  document.getElementById('dateFields').innerHTML = renderDateFields({date: curVal, dateEnd: curVal}, null);
}
window.switchDateType = switchDateType;

async function saveForm(key, isEdit) {
  const d = document.getElementById('fDate').value;
  const dEnd = formDateType === 'range' ? ((document.getElementById('fDateEnd')||{}).value || d) : '';
  const t = document.getElementById('fTitle').value.trim();
  if (!d || !t) { alert('날짜와 제목은 필수입니다.'); return; }
  if (!d.startsWith(String(YEAR))) { alert(`${YEAR}년 날짜만 입력 가능합니다. (현재 선택된 연도)`); return; }
  if (dEnd && dEnd < d) { alert('종료일은 시작일보다 늦어야 합니다.'); return; }
  const link = document.getElementById('fLink').value.trim();
  const data = {
    date: d,
    ...(dEnd && dEnd !== d ? {dateEnd: dEnd} : {}),
    title: t,
    cat: document.getElementById('fCat').value,
    time: document.getElementById('fTime').value.trim(),
    place: document.getElementById('fPlace').value.trim(),
    note: document.getElementById('fNote').value.trim(),
    ...(link ? {link} : {})
  };
  try {
    if (isEdit) await eventsRef.child(key).set(data);
    else await eventsRef.push(data);
    curM = parseInt(d.split('-')[1]) - 1;
    closeModal();
    showToast(isEdit ? '수정되었습니다.' : '추가되었습니다.');
  } catch (e) { alert('저장 실패: ' + e.message); }
}
window.saveForm = saveForm;

let lastDeleted = null;  // {data, year, expireTimerId}
async function delEvt(key) {
  if (!confirm('이 일정을 삭제할까요?')) return;
  const data = events[key];
  if (!data) return;
  try {
    await eventsRef.child(key).remove();
    closeModal();
    if (lastDeleted && lastDeleted.expireTimerId) clearTimeout(lastDeleted.expireTimerId);
    const yearAtDelete = YEAR;
    lastDeleted = {data: {...data}, year: yearAtDelete, expireTimerId: null};
    showToast('삭제되었습니다.', {
      duration: 10000,
      action: {label: '되돌리기', handler: undoDelete}
    });
    lastDeleted.expireTimerId = setTimeout(() => { lastDeleted = null; }, 10000);
  } catch (e) { alert('삭제 실패: ' + e.message); }
}
window.delEvt = delEvt;

async function undoDelete() {
  if (!lastDeleted) return;
  const {data, year} = lastDeleted;
  try {
    await db.ref(`events/${year}`).push(data);
    if (data.date && year === YEAR) {
      curM = parseInt(data.date.split('-')[1]) - 1;
    }
    lastDeleted = null;
    showToast('복구되었습니다.');
  } catch (e) { alert('복구 실패: ' + e.message); }
}
window.undoDelete = undoDelete;

async function doSaveCat() {
  const name = document.getElementById('catName').value.trim();

async function doDelCat(id) {
  const used = Object.values(events).some(e => e.cat === id);

function openCopyFromYear() {
  if (!isAdmin) return;
  const sourceYears = AVAILABLE_YEARS.filter(y => y !== YEAR);
  if (!sourceYears.length) { alert('복사할 수 있는 다른 연도가 없습니다.'); return; }
  const yearOpts = sourceYears.map(y => `<option value="${y}">${y}년</option>`).join('');

  copyPreviewData = null;
  document.getElementById('modal').className = 'modal wide';
  document.getElementById('modal').innerHTML = `
    <div class="mh"><h2>전년도 일정 복사</h2><button class="cx" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <p style="font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px;background:var(--bg);padding:10px 12px;border-radius:var(--rs)">다른 연도의 일정을 현재 선택된 <strong style="color:var(--text)">${YEAR}년</strong>으로 복사합니다. 날짜는 연도만 ${YEAR}로 교체됩니다. 분류가 삭제된 일정은 ⚠ 표시되며 자동 제외됩니다.</p>
      <div class="frow2">
        <div class="fg"><label class="fl">소스 연도</label><select class="fse" id="srcYear">${yearOpts}</select></div>
        <div class="fg"><label class="fl">범위</label><select class="fse" id="srcRange"><option value="all">전체</option>${monthOpts}</select></div>
      </div>
      <div class="fg" style="margin-bottom:8px"><label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer"><input type="checkbox" id="srcIncludeNotices">월별 공지사항도 함께 복사</label></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn-g" onclick="loadCopyPreview()">📂 불러오기</button></div>
      <div id="copyPreview"></div>
    </div>
    <div class="mf"><button class="btn-g" onclick="closeModal()">취소</button><button class="btn-p" id="copyConfirmBtn" onclick="confirmCopyFromYear()" style="display:none">선택한 항목 등록</button></div>`;
  document.getElementById('overlay').classList.add('open');
}
window.openCopyFromYear = openCopyFromYear;

function mapDate(dateStr, toYear) {
  const parts = dateStr.split('-');
  let m = parts[1], d = parseInt(parts[2]);
  if (m === '02' && d === 29) {
    const yn = parseInt(toYear);
    const isLeap = (yn % 4 === 0 && yn % 100 !== 0) || yn % 400 === 0;
    if (!isLeap) d = 28;
  }
  return `${toYear}-${m}-${String(d).padStart(2,'0')}`;
}

async function loadCopyPreview() {
  const srcYear = document.getElementById('srcYear').value;
  const srcRange = document.getElementById('srcRange').value;
  const includeNotices = document.getElementById('srcIncludeNotices').checked;
  const preview = document.getElementById('copyPreview');
  preview.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:1rem 0;text-align:center">불러오는 중...</p>';
  try {
    const snap = await db.ref(`events/${srcYear}`).once('value');
    const src = snap.val() || {};
    let filtered = Object.entries(src).filter(([k, e]) => {
      if (srcRange === 'all') return true;
      return parseInt(e.date.split('-')[1]) === parseInt(srcRange);
    });
    if (!filtered.length) {
      preview.innerHTML = `<p style="color:var(--text3);font-size:13px;padding:1rem 0;text-align:center">선택한 범위에 일정이 없습니다.</p>`;
      document.getElementById('copyConfirmBtn').style.display = 'none';
      copyPreviewData = null;
      return;
    }
    filtered.sort(([, a], [, b]) => a.date < b.date ? -1 : 1);
    const items = filtered.map(([k, e]) => {
      const cat = cats.find(c => c.id === e.cat);
      const newDate = mapDate(e.date, YEAR);
      const newDateEnd = e.dateEnd ? mapDate(e.dateEnd, YEAR) : null;
      const catValid = !!cat;
      return {key: k, data: e, newDate, newDateEnd, catValid, include: catValid};
    });
    let noticeData = null;
    if (includeNotices) {
      const nsnap = await db.ref(`notices/${srcYear}`).once('value');
      noticeData = nsnap.val() || {};
    }
    copyPreviewData = {items, notices: noticeData, srcYear};
    renderCopyPreview();
  } catch (e) {
    preview.innerHTML = `<p style="color:var(--red);font-size:13px;padding:1rem 0">불러오기 실패: ${escHtml(e.message)}</p>`;
    copyPreviewData = null;
  }
}
window.loadCopyPreview = loadCopyPreview;

function renderCopyPreview() {
  if (!copyPreviewData) return;
  const {items, notices: noticeData} = copyPreviewData;
  const selCount = items.filter(x => x.include).length;
  const validCount = items.filter(x => x.catValid).length;
  const invalidCount = items.length - validCount;
  const noticeInfo = noticeData ? `<p style="font-size:12px;color:var(--mint-dark);margin-bottom:10px;padding:6px 10px;background:var(--mint-light);border-radius:var(--rs)">📢 월별 공지 ${Object.keys(noticeData).length}개월 함께 복사됩니다.</p>` : '';
  const invalidInfo = invalidCount ? `<p style="font-size:11px;color:#854F0B;margin-bottom:6px">⚠ 분류가 삭제된 ${invalidCount}건은 자동 제외됩니다.</p>` : '';
  const rows = items.map((it, i) => {
    const cat = cats.find(c => c.id === it.data.cat);
    const catBadge = cat ? `<span class="badge" style="${bs(cat.color)}">${escHtml(cat.name)}</span>` : `<span class="badge" style="background:#FDF0F0;color:#D63B3B">⚠ 분류 없음</span>`;
    const dateDisplay = it.newDateEnd && it.newDateEnd !== it.newDate ? `${it.newDate} ~ ${it.newDateEnd}` : it.newDate;
    const origDisplay = it.data.dateEnd && it.data.dateEnd !== it.data.date ? `${it.data.date} ~ ${it.data.dateEnd}` : it.data.date;
    return `<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)"><input type="checkbox" ${it.include?'checked':''} onchange="toggleCopyItem(${i},this.checked)" ${it.catValid?'':'disabled'} style="margin-top:3px;flex-shrink:0;width:16px;height:16px;cursor:${it.catValid?'pointer':'not-allowed'}"><div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--text3);margin-bottom:3px">${origDisplay} → <strong style="color:var(--text)">${dateDisplay}</strong></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${catBadge}<span style="font-size:13px;font-weight:500">${escHtml(it.data.title)}</span></div></div></div>`;
  }).join('');
  document.getElementById('copyPreview').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px"><div style="font-size:12px;color:var(--text2)"><strong style="color:var(--text)">${selCount}건 선택</strong> / 총 ${items.length}건</div><div style="display:flex;gap:6px"><button class="icon-btn" onclick="toggleAllCopyItems(true)">전체 선택</button><button class="icon-btn" onclick="toggleAllCopyItems(false)">전체 해제</button></div></div>
    ${invalidInfo}${noticeInfo}
    <div style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);padding:4px 12px;background:var(--surface)">${rows}</div>`;
  const btn = document.getElementById('copyConfirmBtn');
  btn.style.display = 'inline-block';
  btn.textContent = `선택한 ${selCount}건 등록`;
  btn.disabled = selCount === 0;
  btn.style.opacity = selCount === 0 ? '0.5' : '1';
}

function toggleCopyItem(idx, checked) {
  if (!copyPreviewData) return;
  if (copyPreviewData.items[idx].catValid) {
    copyPreviewData.items[idx].include = checked;
    renderCopyPreview();
  }
}
window.toggleCopyItem = toggleCopyItem;

function toggleAllCopyItems(checked) {
  if (!copyPreviewData) return;
  copyPreviewData.items.forEach(it => { if (it.catValid) it.include = checked; });
  renderCopyPreview();
}
window.toggleAllCopyItems = toggleAllCopyItems;

async function confirmCopyFromYear() {
  if (!copyPreviewData) return;
  const selected = copyPreviewData.items.filter(it => it.include);
  if (!selected.length) { alert('선택된 일정이 없습니다.'); return; }
  const noticeData = copyPreviewData.notices;
  const noticeCount = noticeData ? Object.keys(noticeData).length : 0;
  if (!confirm(`${selected.length}건의 일정을 ${YEAR}년으로 복사합니다${noticeCount?' (+ 월별 공지 '+noticeCount+'개)':''}.\n진행할까요?`)) return;
  try {
    const promises = selected.map(it => {
      const newData = {...it.data, date: it.newDate};
      if (it.newDateEnd && it.newDateEnd !== it.newDate) newData.dateEnd = it.newDateEnd;
      else delete newData.dateEnd;
      return eventsRef.push(newData);
    });
    await Promise.all(promises);
    if (noticeData) {
      for (const [m, text] of Object.entries(noticeData)) {
        await noticesRef.child(m).set(text);
      }
    }
    copyPreviewData = null;
    closeModal();
    showToast(`${selected.length}건 복사 완료${noticeCount?' (공지 '+noticeCount+'개 포함)':''}`);
  } catch (e) { alert('복사 실패: ' + e.message); }
}
window.confirmCopyFromYear = confirmCopyFromYear;

// ══════════════════════════════════════════
// LOGIN / LOGOUT
// ══════════════════════════════════════════
function openLoginModal() {
  document.getElementById('modal').className = 'modal';
  document.getElementById('modal').innerHTML = `
    <div class="mh"><h2>관리자 로그인</h2><button class="cx" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <div class="fg"><label class="fl">ID</label><input class="fi" type="text" id="loginId" placeholder="아이디" autocomplete="off"></div>
      <div class="fg"><label class="fl">PASSWORD</label><input class="fi" type="password" id="loginPw" placeholder="비밀번호" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="loginErr" style="display:none;color:var(--red);font-size:12px;margin-top:8px;text-align:center">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    </div>
    <div class="mf"><button class="btn-g" onclick="closeModal()">취소</button><button class="btn-p" onclick="doLogin()">로그인</button></div>`;
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => { const i = document.getElementById('loginId'); if (i) i.focus(); }, 100);
}
window.openLoginModal = openLoginModal;

async function doLogin() {
  const id = (document.getElementById('loginId')||{}).value?.trim();
  const pw = (document.getElementById('loginPw')||{}).value;
  const errEl = document.getElementById('loginErr');
  if (id !== ADMIN_UI_ID || pw !== ADMIN_UI_PW) {
    if (errEl) errEl.style.display = 'block';
    return;
  }
  try {
    await auth.signInWithEmailAndPassword(FIREBASE_ADMIN_EMAIL, FIREBASE_ADMIN_PASSWORD);
    isAdmin = true;
    closeModal();
    enterAdminMode();
    showToast('관리자 모드로 전환되었습니다.');
  } catch (e) {
    alert('Firebase 인증 실패: ' + e.message + '\n\n코드 상단의 FIREBASE_ADMIN_EMAIL / FIREBASE_ADMIN_PASSWORD 값이 올바른지 확인하세요.');
  }
}
window.doLogin = doLogin;

async function doLogout() {
  try { await auth.signOut(); } catch (e) {}
  isAdmin = false;
  exitAdminMode();
  showToast('로그아웃되었습니다.');
}
window.doLogout = doLogout;

function enterAdminMode() {
  document.body.classList.add('admin-mode');
  document.getElementById('adminToolbar').style.display = 'block';
  populateYearSelect();
  updatePastYearBanner();
  renderCal();
  renderNotice();
}

function exitAdminMode() {
  document.body.classList.remove('admin-mode');
  document.getElementById('adminToolbar').style.display = 'none';
  updatePastYearBanner();
  // Return to default year/month per settings
  if (YEAR !== DEFAULT_YEAR) {
    subscribeYear(DEFAULT_YEAR);
  }
  applyDefaultMonth();
  renderCal();
  renderNotice();
}

// ══════════════════════════════════════════
// UTIL
// ══════════════════════════════════════════
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  editCatId = null; selColor = 'pink'; pendingLogoData = ''; copyPreviewData = null;
}
window.closeModal = closeModal;

let toastTimerId = null;
function showToast(msg, options) {
  const t = document.getElementById('toast');
  clearTimeout(toastTimerId);
  const action = options && options.action;
  const duration = (options && options.duration) || 2200;
  if (action) {
    t.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = msg;
    const btn = document.createElement('button');
    btn.className = 'toast-btn';
    btn.textContent = action.label;
    btn.onclick = () => { t.classList.remove('show'); action.handler(); };
    t.appendChild(span); t.appendChild(btn);
  } else {
    t.textContent = msg;
  }
  t.classList.add('show');
  toastTimerId = setTimeout(() => t.classList.remove('show'), duration);
}
</script>
